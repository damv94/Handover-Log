<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handover Log</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6e8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handover Log">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">

<link rel="stylesheet" href="fonts.css">
<style>
/* Layout idea: an alarm-panel style menu that mirrors the company form (left), the selected section on the right. Status = colour + symbol + word. */
:root{
  --bg:#eceff2; --surface:#ffffff; --soft:#f4f6f8; --ink:#17212b; --muted:#5a6774; --line:#d3d9df;
  --accent:#0b6e8a; --accent-ink:#ffffff; --accent-soft:#e1f0f4;
  --ok:#2b8a3e; --ok-soft:#e3f3e7;
  --warn:#b25f00; --warn-soft:#fdefd8;
  --bad:#c92a2a; --bad-soft:#fbe7e7;
  --live:#1b64c9; --live-soft:#e3edfb;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#161f28; --soft:#1b2631; --ink:#e4e9ee; --muted:#93a1ae; --line:#2b3846;
    --accent:#4fb3cf; --accent-ink:#0b1a20; --accent-soft:#16323c;
    --ok:#69db7c; --ok-soft:#163020; --warn:#ffb84d; --warn-soft:#3a2a10; --bad:#ff8787; --bad-soft:#3d1c1c;
    --live:#74b3ff; --live-soft:#14294a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --soft:#1b2631; --ink:#e4e9ee; --muted:#93a1ae; --line:#2b3846;
  --accent:#4fb3cf; --accent-ink:#0b1a20; --accent-soft:#16323c;
  --ok:#69db7c; --ok-soft:#163020; --warn:#ffb84d; --warn-soft:#3a2a10; --bad:#ff8787; --bad-soft:#3d1c1c;
  --live:#74b3ff; --live-soft:#14294a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.hidden{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:19px}
.brand .ship{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.brand .ship:hover{color:var(--accent);text-decoration:underline}
.top-inner .progress{flex:1 1 260px;display:flex;flex-direction:column;gap:4px;min-width:200px}
.top-inner .progress .bar{height:8px;border-radius:5px;background:var(--soft);border:1px solid var(--line);overflow:hidden;display:flex}
.top-inner .progress .bar span{display:block;height:100%}
.top-inner .progress .txt{font-size:13px;color:var(--muted)}
.top-inner .progress .txt b{color:var(--ink);font-weight:600}
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.gate-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.gate-card h1{font-family:var(--font-display);font-size:26px;margin:8px 0 10px}
.gate-card p{margin:0 0 12px;line-height:1.5}
.gate-card textarea{width:100%;font-family:var(--font-mono);font-size:13px;margin:4px 0 6px;word-break:break-all}
.gate-card .btn.primary{width:100%;justify-content:center;min-height:44px}
.gate-logo{width:52px;height:52px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);font-size:20px}
.gate-err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:8px}
.gate-steps{margin:0 0 14px;padding-left:22px;line-height:1.55}.gate-steps li{margin-bottom:6px}
#licBox:empty{display:none}
.lic-line{margin:10px 6px 4px;padding-top:10px;border-top:1px solid var(--line);line-height:1.6}
.lic-warn{color:var(--warn);font-weight:700}
.save-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ring{display:none}
.menu-foot:empty{display:none}
@media (max-width:600px){
  .top-inner{flex-wrap:nowrap;padding:8px 14px;gap:10px}
  .top-inner .progress{display:none}
  .brand{flex:1}
  .brand h1{font-size:17px}
  body:not(.v-home) .brand .ship{display:none}
  .ring{--p:0;display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;text-decoration:none;
    background:conic-gradient(var(--ok) calc(var(--p) * 1%), var(--line) 0);position:relative}
  .ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
  .ring span{position:relative;font-size:12px;font-weight:700;color:var(--ink);font-family:var(--font-mono)}
  .ring.done span{color:var(--ok)}
  .theme-sw .w{display:none}
  .theme-sw{flex:none}
  .theme-sw .o{padding:6px 9px;font-size:15px}
  .docbox{max-height:none;overflow:visible}
  .menu-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 4px 4px;padding-top:12px;border-top:1px solid var(--line)}
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.busy{background:var(--warn)} .dot.off{background:var(--bad)}

/* Buttons and fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.ok{background:var(--ok);border-color:var(--ok);color:#0e141a} :root:not([data-theme="light"]) .btn.ok:hover{filter:brightness(1.06)} :root:not([data-theme="light"]) .btn.ok:disabled{background:#2a4a33;border-color:#2a4a33;color:#8fb39a;filter:none} }
:root[data-theme="dark"] .btn.ok{background:var(--ok);border-color:var(--ok);color:#0e141a}
:root[data-theme="dark"] .btn.ok:hover{filter:brightness(1.06)}
:root[data-theme="dark"] .btn.ok:disabled{background:#2a4a33;border-color:#2a4a33;color:#8fb39a;filter:none}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.big{min-height:44px;padding:8px 18px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.lbl{display:block;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:40px}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
input:disabled,textarea:disabled,select:disabled{opacity:.7}
.field.missing input{border-color:var(--bad);background:var(--bad-soft)}
.field.missing label.lbl{color:var(--bad)}
.field .hint{font-size:12px;margin-top:3px;color:var(--bad)}
.grid{display:grid;gap:12px}
.grid>*,.field{min-width:0}
input[type=date]{max-width:100%;min-width:0}
/* iPhone/iPad: Safari gives date boxes a fixed native width that ignores the card; let them fit like the other boxes */
@supports (-webkit-touch-callout: none){
  input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%}
  input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.5em}
}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:720px){.g2,.g3{grid-template-columns:1fr}}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
input[type=radio],input[type=checkbox],select,input[type=date],label.check,.chip,.swatch,.sw2,.tile,.mi{cursor:pointer}
input:disabled,select:disabled,label.check:has(input:disabled){cursor:not-allowed}

/* Shell */
.shell{max-width:1400px;margin:0 auto;padding:16px 16px 90px;display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}
/* Laptops and bigger screens: a wider menu so section names stay on one line */
@media (min-width:1100px){.shell{grid-template-columns:clamp(360px,29vw,420px) minmax(0,1fr);gap:22px}}
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.content{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  body.v-home .content{display:none}
  body:not(.v-home) .side{display:none}
}
.back{display:none}
@media (max-width:860px){.back{display:inline-flex}}

/* Menu */
.mg{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.mi{display:grid;grid-template-columns:24px auto 1fr;gap:9px;align-items:center;padding:8px 10px 8px 8px;border-radius:9px;text-decoration:none;margin:4px 0;border:1px solid transparent;transition:filter .12s}
.mi:hover{filter:brightness(.97)}
.mi[aria-current="page"]{box-shadow:0 0 0 2px var(--ink) inset}
.mi .st{font-family:var(--font-mono);font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap;width:112px;text-align:left}
.mi.st-plain .st{width:0;padding:0}
.mi .num{font-family:var(--font-mono);font-size:15px;font-weight:600;text-align:center}
.mi .t{font-weight:600;font-size:14px;line-height:1.25;display:block}
.mi .n{font-size:12px;color:var(--muted);display:block;line-height:1.3}
.st-empty{background:var(--bad-soft);border-color:color-mix(in srgb, var(--bad) 30%, transparent)} .st-empty .st{background:var(--bad);color:#fff} .st-empty .num{color:var(--bad)}
.st-progress{background:var(--warn-soft);border-color:color-mix(in srgb, var(--warn) 30%, transparent)} .st-progress .st{background:var(--warn);color:#fff} .st-progress .num{color:var(--warn)}
.st-live{background:var(--live-soft);border-color:color-mix(in srgb, var(--live) 30%, transparent)} .st-live .st{background:var(--live);color:#fff} .st-live .num{color:var(--live)}
.st-locked{background:var(--soft);border-color:var(--line)} .st-locked .st{background:var(--line);color:var(--muted)} .st-locked .num{color:var(--muted)}
.mi.st-locked .st{color:var(--muted)!important}
.st-ready{background:var(--ok-soft);border-color:color-mix(in srgb, var(--ok) 30%, transparent)} .st-ready .st{background:var(--ok);color:#fff} .st-ready .num{color:var(--ok)}
.st-complete{background:var(--ok-soft);border-color:color-mix(in srgb, var(--ok) 30%, transparent)} .st-complete .st{background:var(--ok);color:#fff} .st-complete .num{color:var(--ok)}
.st-plain{background:transparent}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .mi .st{color:#0e141a} }
:root[data-theme="dark"] .mi .st{color:#0e141a}
@media (prefers-reduced-motion:reduce){.mi{transition:none}}
.badge{font-family:var(--font-mono);font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.badge.empty{background:var(--bad-soft);color:var(--bad)} .badge.progress{background:var(--warn-soft);color:var(--warn)}
.badge.live{background:var(--live-soft);color:var(--live)} .badge.complete{background:var(--ok-soft);color:var(--ok)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.sec-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sec-head .numbig{font-family:var(--font-mono);font-size:30px;font-weight:500;line-height:1;color:var(--muted);min-width:34px}
.sec-head h2{font-size:22px}
.sec-head .formq{font-size:15px;line-height:1.45;color:var(--muted);margin-top:4px}
.sec-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-head{flex-wrap:nowrap}
.sec-head > div:not(.right){flex:1 1 0;min-width:0}
.sec-head .right{flex:none;flex-wrap:nowrap;align-self:flex-start}
@media (max-width:860px){
  .sec-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;row-gap:12px;align-items:start}
  .sec-head .back{grid-column:1/3;grid-row:1;justify-self:start;white-space:nowrap}
  .sec-head .right{grid-column:3;grid-row:1;align-self:center}
  .sec-head .numbig{grid-column:1;grid-row:2}
  .sec-head > div:not(.right){grid-column:2/4;grid-row:2}
  .sec-head:not(:has(.numbig)) > div:not(.right){grid-column:1/-1}
  /* several buttons (e.g. Form preview): put them on their own row under the title so they don't cover "‹ Menu" */
  .sec-head .right:has(> :nth-child(2)){grid-column:1/-1;grid-row:3;flex-wrap:wrap;align-self:stretch}
  .sec-head .right:has(> :nth-child(2)) > .btn{flex:1 1 auto;justify-content:center}
}
.guide{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:16px;line-height:1.5;margin-top:12px}
.guide-d{margin-top:12px}
.guide-d>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;color:var(--accent);padding:6px 12px 6px 10px;border-radius:999px;background:var(--accent-soft);user-select:none}
.guide-d>summary::-webkit-details-marker{display:none}
.guide-d>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.guide-d[open]>summary::before{transform:rotate(45deg) translate(-1px,-1px)}
.guide-d>summary:hover{filter:brightness(.97)}
.guide-d>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.guide-d>.guide{margin-top:8px}
.statusbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.statusbar .spacer{flex:1}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--accent-soft)} .banner.warn{background:var(--warn-soft)} .banner.bad{background:var(--bad-soft)} .banner.ok{background:var(--ok-soft)}
.banner .spacer{flex:1}
.empty-box{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* Entries */
.entries{display:flex;flex-direction:column;gap:8px}
.grp-h{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-top:8px}
.grp-h .sw{width:12px;height:12px;border-radius:3px}
.grp-h .cond{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:13px}
.entry{display:grid;grid-template-columns:6px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.entry .stripe{background:var(--line)}
.entry .body{padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.entry .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.entry .ttl{font-weight:600}
.entry .tag{font-family:var(--font-mono);font-size:13px;font-weight:500;background:var(--soft);border-radius:4px;padding:0 6px}
.entry .det{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.entry .meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.entry .acts{display:flex;gap:6px;flex-wrap:wrap}
.entry.closed .ttl{color:var(--muted)}
.entry.closed[data-id]{opacity:.62}
.entry.closed[data-id]:hover,.entry.closed[data-id]:focus-within{opacity:1}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.open{color:var(--warn);background:var(--warn-soft)}
.pill.closed{color:var(--ok);background:var(--ok-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.pill.sec{color:var(--muted);border:1px solid var(--line);font-weight:500}
.pill.ex{color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 6px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip .sw{width:12px;height:12px;border-radius:3px;flex:0 0 12px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);font-weight:600}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Systems */
.sysrow{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.sysrow:first-child{border-top:0}
.sysrow .sw{width:14px;height:14px;border-radius:4px;margin-top:4px}
.sysrow .name{font-weight:600}
.sysrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.swatch{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}

/* Overview */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile.all .num{color:var(--ink)}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,1fr)}.tiles .tile.all{grid-column:1 / -1}}
.tile{border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .12s, box-shadow .12s}
.tile:hover{border-color:var(--accent)}
.tile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink) inset;border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.tile .num{font-family:var(--font-mono);font-size:26px;font-weight:500;line-height:1.1}
.tile .lab{font-size:13px;color:var(--muted)}
.tile.empty .num{color:var(--bad)} .tile.progress .num{color:var(--warn)} .tile.live .num{color:var(--live)} .tile.complete .num{color:var(--ok)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo a{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none}
.todo a:hover{border-color:var(--accent)}

/* Sign-off & form preview */
.form-sec{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.form-sec + .form-sec{margin-top:8px}
.fs-head{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--soft);padding:8px 12px 8px 0;border-bottom:1px solid var(--line)}
.fs-num{font-family:var(--font-mono);font-weight:500;text-align:center}
.fs-title{font-weight:600;font-size:14px}
.fs-body{padding:10px 14px 12px 54px;display:flex;flex-direction:column;gap:8px;font-size:14px}
@media (max-width:720px){.fs-body{padding-left:14px}}
.fs-body .sysname{font-weight:700;display:flex;align-items:center;gap:8px}
.fs-body .sysname .sw{width:10px;height:10px;border-radius:2px}
.fs-body .ih{font-weight:600}
.fs-body .id{white-space:pre-wrap;overflow-wrap:anywhere}

.toast.show{opacity:1}
.party{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,16,24,.45);animation:partyIn .25s ease-out}
.party canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.party-card{position:relative;background:var(--surface);color:var(--ink);border-radius:16px;padding:26px 26px 22px;max-width:min(420px,90vw);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:partyPop .45s cubic-bezier(.2,1.4,.4,1)}
.party-card h2{font-size:22px;margin:6px 0 6px}
.party-card p{margin:0 0 10px}
.party-card .btn{margin-top:8px;min-width:140px}
.party-emoji{font-size:44px;line-height:1}
.party.out{opacity:0;transition:opacity .3s}
@keyframes partyIn{from{opacity:0}to{opacity:1}}
@keyframes partyPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.party,.party-card{animation:none}}
@media (hover:none),(pointer:coarse){.kbd-hint{visibility:hidden}}
#overlay:not(.hidden) ~ .toast{top:16px;bottom:auto}
.toast.has-undo{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:6px 8px 6px 16px}
.toast.has-undo>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast-undo{all:unset;cursor:pointer;font-weight:700;color:var(--accent-soft);padding:6px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.toast-undo:hover,.toast-undo:focus-visible{background:rgba(127,127,127,.25)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body class="v-home">
<header class="top">
  <div class="top-inner">
    <div class="brand"><h1>Handover Log</h1><a class="ship" id="hdrShip" href="#details" title="Your details: ship, name and rank">Set up your details to start</a></div>
    <div class="progress" aria-live="polite">
      <div class="bar" id="progBar" aria-hidden="true"></div>
      <div class="txt" id="progTxt"></div>
    </div>
    <button type="button" class="sw2 theme-sw" role="switch" id="themeSw" aria-checked="false" aria-label="Dark mode" title="Switch between light and dark mode"><span class="o no">☀<span class="w"> Light</span></span><span class="o yes">☾<span class="w"> Dark</span></span></button>
    <span class="save-state"><span class="dot busy" id="saveDot"></span><span id="saveText">Connecting…</span></span>
    <a class="ring" id="progRing" href="#overview" title="Overview of all sections" aria-label="Progress"><span id="progRingTxt"></span></a>
  </div>
</header>

<div class="shell">
  <nav class="side" aria-label="Handover form sections"><div id="menu"></div><div class="menu-foot" id="menuFoot"></div><div id="licBox"></div></nav>
  <main class="content" id="content"></main>
</div>

<button class="btn primary fab" type="button" id="fab" title="Add an entry to any section">+ New entry</button>

<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form class="modal" id="mForm" autocomplete="off">
    <div style="display:flex;align-items:center;gap:10px">
      <h2 id="mTitle">New entry</h2><span style="flex:1"></span>
      <button class="btn sm" type="button" id="mClose">Close</button>
    </div>
    <div id="wTypes">
      <label class="lbl" id="mTypeLbl">Goes into form section</label>
      <div class="seg" id="mTypes" role="group" aria-labelledby="mTypeLbl"></div>
    </div>
    <div class="hidden" id="wReqNo"><label class="lbl" for="fReqNo">Requisition no.</label><div class="prefix-in"><span class="pre" aria-hidden="true">REQ-</span><input type="text" id="fReqNo" class="mono" placeholder="0412" aria-label="Requisition number, after REQ-"></div></div>
    <div class="grid hidden" id="reqTop" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start"></div>
    <div class="grid" id="wRow1" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start">
      <div id="wSys" style="grid-column:1;grid-row:1"><label class="lbl" for="fSys">System</label><select id="fSys"></select><div class="small muted" id="fSysNote" style="margin-top:3px"></div></div>
      <div id="wEquip" style="grid-column:1;grid-row:2"><label class="lbl" for="fEquip">Equipment<span class="muted" id="equipOpt"></span></label><input type="text" id="fEquip" list="equipList" placeholder="e.g. Ballast pump #1"></div>
      <div id="wTag" style="grid-column:2;grid-row:2"><label class="lbl" for="fTag">Equipment tag / valve No. <span class="muted">(optional)</span></label><input type="text" id="fTag" placeholder="e.g. XA-01C, SW-043"></div>
    </div>
    <div class="grid row2" id="wRow2">
      <div id="wTitle"><label class="lbl" for="fTitle" id="fTitleLbl">Title</label><input type="text" id="fTitle"></div>
      <div id="wDate"><label class="lbl" for="fDate" id="fDateLbl">Date</label><input type="date" id="fDate"></div>
      <div id="wJob" class="hidden"><label class="lbl" for="fJobNo">PMS job no. <span class="muted">(optional)</span></label><input type="text" id="fJobNo" class="mono"></div>
    </div>
    <div class="grid g3 hidden" id="pmsFields">
      <div><label class="lbl" for="fDue">Due date</label><input type="date" id="fDue"></div>
    </div>
    <div><label class="lbl" for="fDetails" id="fDetailsLbl">Comment</label><textarea id="fDetails" rows="4"></textarea></div>
    <div class="grid hidden" id="reqFields" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div><label class="lbl" for="fReqPort">Expected port</label><input type="text" id="fReqPort" placeholder="e.g. Miami"></div>
      <div><label class="lbl" for="fReqEta">Expected date</label><input type="date" id="fReqEta"></div>
    </div>
    <label class="check" id="openWrap"><input type="checkbox" id="fOpen"> <span id="openLabel">Still open – carry over to the next engineer</span></label>
    <div class="small" id="mMsg" role="status" style="color:var(--bad)"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <span class="small muted kbd-hint" style="align-self:center;margin-right:auto">Ctrl+Enter to save</span>
      <button class="btn" type="button" id="mCancel">Cancel</button>
      <button class="btn primary" type="submit" id="mSave">Save entry</button>
    </div>
  </form>
</div>
<datalist id="equipList"></datalist>
<input type="file" id="formFileGlobal" accept=".docx,.doc,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="hidden" aria-label="Company form file">
<input type="file" id="logoFileGlobal" accept="image/png,image/jpeg,image/webp" class="hidden" aria-label="Company logo image">
<input type="file" id="restoreFileGlobal" accept=".json,application/json" class="hidden" aria-label="Backup file">

    else if(sec.kind === "text"){ const r = review(sec.id); out.text = r && r.none ? noneOf(sec, r).text : r && r.na ? naText(r, sec) : (S.standing[sec.key] || ""); }

function sectionBodyText(s){ const L = [];
  if(s.kind === "text") L.push(s.text || "");
  else s.blocks.forEach(b => { if(b.type === "thread"){ L.push(b.text + (b.open ? " [NOT SOLVED]" : "")); b.updates.forEach(u => L.push(`${u.date} – ${u.title ? dot(u.title) + " " : ""}${u.text}`)); L.push(""); } else if(b.type === "item"){ L.push(b.text + (b.open ? " [NOT SOLVED]" : "")); if(b.details) L.push(b.details); L.push(""); } else if(b.type === "line") L.push("- " + b.text); else L.push(b.text); });
  return L.join("\n").replace(/\n{3,}/g, "\n\n").trim(); }
function modelToText(md){
  const L = [`${md.title} – ${md.code}`, "", `SHIP: ${md.ship}    DATE: ${fmtDate(md.date)}    IN PORT: ${md.port}`,
    `HANDING-OVER OFFICER: ${md.outName} / ${md.outRank}${md.outSigned ? "   (signed " + fmtStamp(md.outSigned) + ")" : ""}`,
    `TAKING-OVER OFFICER: ${md.inName} / ${md.inRank}${md.inSigned ? "   (signed " + fmtStamp(md.inSigned) + ")" : ""}`, ""];
  md.sections.forEach(s => {
    if(s.group){ L.push(s.group, ""); return; }
    L.push(`${s.n}. ${s.title}`);
    L.push(sectionBodyText(s));
    L.push("");
  });
  if(md.chiefSigned) L.push(`Reviewed by Chief Engineer ${md.chief} (${fmtStamp(md.chiefSigned)})`);
  return L.join("\n").replace(/\n{3,}/g, "\n\n");
}

const _fadeCache = {};
function fadeLogo(logo){ if(!logo) return Promise.resolve(null); if(_fadeCache[logo.data]) return Promise.resolve(_fadeCache[logo.data]);
  return new Promise(res => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight; const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.globalAlpha = 0.5; g.filter = "saturate(75%)"; g.drawImage(img, 0, 0);
      const out = {data: c.toDataURL("image/png"), w: c.width, h: c.height}; _fadeCache[logo.data] = out; res(out); };
    img.onerror = () => res(logo); img.src = logo.data; }); }

async function migrateToTemplate(newTpl){

}

  if(db){
    mode = "db";
    COLS.forEach(col => db.collection(col).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { if(!pendingDel.has(col + "/" + d.id)) o[d.id] = d.data(); }); S[col] = o;
      if(!snap.metadata.fromCache) loaded.add(col); if(loaded.size >= NEED_LOADED){ clearTimeout(timer); maybeImportLogo(); } scheduleRender(); },
      () => { loaded.add(col); toast("Lost connection to saved data. Reopen the page later."); render(); }));
    Object.entries(DOCS).forEach(([path,key]) => db.doc(path).onSnapshot(snap => { if(!dirty[path]) S[key] = snap.exists ? {...snap.data()} : {};
      if(!snap.metadata.fromCache) loaded.add(path); if(loaded.size >= NEED_LOADED){ clearTimeout(timer); maybeImportLogo(); } scheduleRender(); }, () => { loaded.add(path); scheduleRender(); }));
  } else {
    mode = "local"; clearTimeout(timer);
    let stored = null; try{ stored = JSON.parse(localStorage.getItem(LS_KEY) || "null"); }catch(e){}
    if(stored) ["meta","handover","standing","logo","template","equipment","entries","archive"].forEach(k => { S[k] = stored[k] || {}; });
    render(true);
  }
}
init();
</script>
</body>
</html>
